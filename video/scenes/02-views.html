<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden}
body{font-family:Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#0f1a26;color:#fff;position:relative}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 30%}
.dim{filter:saturate(.8) brightness(.62) hue-rotate(-12deg)}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,26,38,.45),rgba(15,26,38,.15) 35%,rgba(15,26,38,.9))}
.pad{position:absolute;inset:0;padding:120px 150px;display:flex;flex-direction:column}
h1{font-weight:300;font-size:120px;line-height:.98;letter-spacing:-.045em;margin:auto 0 30px}
h2{font-weight:400;font-size:76px;line-height:1.04;letter-spacing:-.035em;margin:0 0 28px;max-width:20ch}
p{font-size:32px;line-height:1.45;color:rgba(255,255,255,.8);max-width:52ch;margin:0}
.brand{display:flex;align-items:center;gap:16px;font-size:30px;font-weight:600}
.brand img{height:54px}.brand small{font-weight:400;opacity:.7}
.light{background:#e7eaee;color:#141d27}.light p{color:#5a6878}
pre{margin:0;padding:36px 44px;border-radius:32px;background:#0a121b;font:400 22px/1.62 "Geist Mono",monospace;white-space:pre;color:#dfe6ee;overflow:hidden}
pre b{color:#fff;font-weight:500}
.t-chain{color:#7fb4e6}.t-priv{color:#e8b36a}.t-no{color:#f08a80}.t-ok{color:#5fd39b}
table{border-collapse:separate;border-spacing:0;background:#fff;border-radius:32px;overflow:hidden;font-size:27px;width:100%}
th,td{padding:26px 28px;text-align:left;border-top:1px solid #d5dbe2;vertical-align:top}
thead th{border-top:0;color:#5a6878;font-weight:400;font-size:23px}
tbody th{font-weight:500}.y{color:#26885f}.n{color:#5a6878}
.tx{display:grid;grid-template-columns:260px 1fr;gap:18px 30px;background:#fff;border-radius:32px;padding:44px 50px;font-size:30px}
.tx dt{color:#5a6878}.tx dd{margin:0;font-family:"Geist Mono",monospace;font-size:27px}
.leak{color:#c2413a}
.list{display:grid;gap:18px;margin-top:10px}
.list div{background:rgba(255,255,255,.08);border-radius:22px;padding:24px 30px;font-size:30px}
.list b{font-weight:500}
.cmds{display:flex;gap:16px;flex-wrap:wrap;margin-top:40px}
.cmds code{font-family:"Geist Mono",monospace;font-size:26px;background:rgba(255,255,255,.1);padding:14px 20px;border-radius:14px}
.foot{margin-top:auto;font-size:26px;color:rgba(255,255,255,.7)}
</style></head><body class="light"><div class="pad"><h2>On Midnight, the rule runs on data the chain never sees.</h2><table style="margin-top:30px"><thead><tr><th></th><th>Sender</th><th>Amount</th><th>Purpose</th><th>Which one</th><th>School</th></tr></thead><tbody><tr><th>The chain</th><td class="n">No</td><td class="n">Under 10,000</td><td class="n">No</td><td class="n">Unlinkable</td><td class="y">When it settles</td></tr><tr><th>The school</th><td>Own records</td><td class="y">Yes</td><td class="y">Yes</td><td class="y">Yes</td><td class="y">Itself</td></tr><tr><th>An auditor, one receipt</th><td class="y">That one</td><td class="y">That one</td><td class="y">That one</td><td class="y">That one</td><td class="y">Yes</td></tr></tbody></table></div></body></html>
